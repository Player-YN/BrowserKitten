<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文档 · Browser Kitten</title>
    <link rel="stylesheet" href="workLock.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #f4f3ef; color: #111113; font-family: system-ui, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
      #boot { padding: 24px 16px; font-size: 13px; color: #6b636b; }
      #boot.error { color: #9f1239; }
      #app { max-width: 42rem; margin: 0 auto; padding: 28px 20px 64px; }
      #app h1 { font-size: 1.6rem; line-height: 1.3; }
      #app p, #app li { font-size: 15px; line-height: 1.6; }
      #app img { max-width: 100%; height: auto; }
      body.is-ready #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="boot">正在打开文档…</div>
    <article id="app"></article>
    <script src="workLock.js"></script>
    <script type="module" src="docs.js"></script>
  </body>
</html>
